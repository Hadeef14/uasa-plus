function quiz(qs,ctx){R={raw:qs,qs:qs.map(sq),i:0,c:0,a:false,ctx};draw()}
function draw(){
 const q=R.qs[R.i];
 if(q.w){
  view(`<div class="qz"><div class="row"><button class="btn g" data-a="back" aria-label="Quit">✕</button>${bar(R.i/R.qs.length*100)}</div>
  <small>${esc(R.ctx.title)} · Writing ${R.i+1} of ${R.qs.length}</small>
  ${q.to?`<div class="card" style="margin:8px 0;font-size:15px"><div><b>To:</b> ${esc(q.to)}</div><div><b>From:</b> ${esc(q.from||"")}</div><div><b>Subject:</b> ${esc(q.subject||"")}</div></div>`:""}
  <h2>${esc(q.w)}</h2>
  <p class="mu">Write between <b>${q.min}</b> and <b>${q.max}</b> words.</p>
  <textarea id="wt" rows="8" placeholder="Write your answer here..."></textarea>
  <p id="wc" class="mu">0 words</p>
  <button class="btn" data-a="submitW">SUBMIT</button>
  <div id="wfb" role="status"></div>
  <button id="nx" class="btn hidden" data-a="next">${R.i+1<R.qs.length?"CONTINUE":"FINISH"}</button></div>`);
  const ta=$("wt"),wcEl=$("wc");
  const draftKey="draft_"+USER.id+"_"+R.i+"_"+(R.ctx.key||"x");
  const saved=st.get(draftKey);if(saved)ta.value=saved;
  const updateWC=()=>{
   const n=(ta.value.trim().match(/\S+/g)||[]).length;
   wcEl.textContent=n+" words";
   wcEl.style.color=(n>=q.min&&n<=q.max)?"var(--gd)":"var(--mu)"
  };
  ta.addEventListener("input",()=>{updateWC();st.set(draftKey,ta.value)});
  updateWC();
  ta.focus();
  return
 }
 view(`<div class="qz"><div class="row"><button class="btn g" data-a="back" aria-label="Quit quiz">✕</button>${bar(R.i/R.qs.length*100)}</div><small>${esc(R.ctx.title)} · Question ${R.i+1} of ${R.qs.length}</small><h2>${esc(q.q)}</h2>${q.img?`<div class="qimg">${q.img}</div>`:""}<div id="an">${q.options.map((o,k)=>`<button class="ans" data-a="ans" data-r="${k}"><b>${"ABCD"[k]||k+1}</b><span>${esc(o)}</span></button>`).join("")}</div><div id="fb" role="status"></div><button id="nx" class="btn hidden" data-a="next">${R.i+1<R.qs.length?"CONTINUE":"FINISH"}</button></div>`)
}
async function answer(k){
 if(!R||R.a||!$("an"))return;
 const q=R.qs[R.i];if(k<0||k>=q.options.length)return;
 R.a=true;const ok=k===q.answer;if(ok)R.c++;
 const practice=R.ctx.kind==="mix"||R.ctx.kind==="daily"||R.ctx.kind==="review"||R.ctx.kind==="challenge";
 if(!ok&&practice){await loseHeart()}
 document.querySelectorAll("#an .ans").forEach((b,x)=>{b.disabled=true;if(x===q.answer)b.classList.add("ok");else if(x===k)b.classList.add("no")});
 const correctLetter="ABCD"[q.answer]||q.answer+1;
 const correctText=q.options[q.answer];
 $("fb").innerHTML=`<div class="fb">${ok?"✅ Correct!":"❌ Not quite. Correct answer: "+correctLetter+") "+esc(correctText)}</div>${ok?"":`<div class="fb why" id="whyBox">💡 Loading explanation…</div>`}`;
 $("nx").classList.remove("hidden");$("nx").focus();
 if(!ok)await loadWhy(q,correctLetter,correctText,k);
}
async function loadWhy(q,correctLetter,correctText,wrongIdx){
 const box=$("whyBox");if(!box)return;
 const cacheKey="why_"+btoa(unescape(encodeURIComponent(q.q))).slice(0,60);
 const cached=st.get(cacheKey);
 if(cached){box.innerHTML="💡 <b>Why:</b> "+esc(cached);return}
 try{
  const res=await sb.functions.invoke("explain-answer",{body:{question:q.q,correct:correctText,chosen:q.options[wrongIdx]}});
  if(res.error)throw res.error;
  const why=(res.data&&res.data.why)||"";
  if(why){st.set(cacheKey,why);box.innerHTML="💡 <b>Why:</b> "+esc(why)}
  else box.innerHTML="💡 <b>Why:</b> <span class='mu'>Explanation not available right now.</span>";
 }catch(e){
  console.error("why failed",e);
  box.innerHTML="💡 <b>Why:</b> <span class='mu'>Explanation not available right now.</span>";
 }
}
async function submitW(){
 if(!R||R.a)return;
 const q=R.qs[R.i],ta=$("wt");
 if(!ta)return;
 const n=(ta.value.trim().match(/\S+/g)||[]).length;
 if(n<q.min||n>q.max){
  $("wfb").innerHTML=`<div class="fb no">Write between ${q.min} and ${q.max} words. You wrote ${n}.</div>`;
  return
 }
 const btn=document.querySelector('[data-a="submitW"]');
 btn.disabled=true;btn.textContent="CHECKING...";
 $("wfb").innerHTML=`<div class="fb">📝 Marking your essay…</div>`;
 try{
  const res=await sb.functions.invoke("grade-essay",{body:{essay:ta.value.trim(),prompt:q.w,min:q.min,max:q.max}});
  if(res.error)throw res.error;
  const d=res.data||{};
  const score=+d.score||0;
  const pass=score>=5;
  let html=`<div class="fb ${pass?"ok":"no"}">Score: <b>${score}/10</b><br>${esc(d.feedback||"")}</div>`;
  if(Array.isArray(d.improvements)&&d.improvements.length){
   html+=`<div class="fb">💡 ${d.improvements.map(esc).join("<br>💡 ")}</div>`
  }
  $("wfb").innerHTML=html;
  st.del("draft_"+USER.id+"_"+R.i+"_"+(R.ctx.key||"x"));
  sb.from("essays").insert({
   user_id:USER.id,
   lesson_key:R.ctx.key||null,
   prompt:q.w,
   essay:ta.value.trim(),
   score,
   feedback:String(d.feedback||""),
   improvements:Array.isArray(d.improvements)?d.improvements:[],
   word_count:n
  }).then(r=>{if(r.error)console.error("essay save failed",r.error)});
  if(pass){
   R.a=true;R.c++;
   btn.classList.add("hidden");
   $("nx").classList.remove("hidden");
   $("nx").focus()
  }else{
   btn.disabled=false;btn.textContent="TRY AGAIN"
  }
 }catch(e){
  $("wfb").innerHTML=`<div class="fb no">⚠️ Could not mark: ${esc(e.message||String(e))}</div>`;
  btn.disabled=false;btn.textContent="SUBMIT"
 }
}

async function finish(){
 const{c,qs,ctx}=R,ratio=c/qs.length,pass=ratio>=.7;let xp=0;
 if(ctx.kind==="review"){
  if(pass&&ctx.reviewKey)await completeReview(ctx.reviewKey);
 } else if(ctx.kind==="daily"){
  if(pass&&USER.dailyDone!==today()){xp=ratio===1?150:100;awardDaily(c,qs.length);}
 } else if(ctx.key&&pass&&!done(ctx.key)){
  xp=c*10+ctx.bonus;
  award(c,qs.length,ctx.bonus,ctx.key);
 }
 const stars=ratio===1?3:ratio>=.9?2:pass?1:0;
 let nb="";
 if(pass&&ctx.kind==="lesson"){
  const s=NAV.s,u=U(s).find(x=>x.i===NAV.u),x=u.ls.findIndex(l=>l.j===NAV.l),n=u.ls[x+1];
  nb=n?`<button class="btn" data-a="les" data-r="${n.j}">NEXT LESSON</button>`:(chOpen(s,u)&&(u.challenge||[]).length?`<button class="btn" data-a="startCh">UNIT CHALLENGE</button>`:"")
 }
 const msg=ctx.kind==="review"?(pass?"✨ Review complete! +5 XP":"You need 70% to complete the review."):ctx.kind==="daily"?(pass?"🎯 Daily challenge complete!":"You need 70% to complete the daily."):ctx.kind==="mix"?"Nice practice!":pass?"You passed! 🎉":"Almost there. You need 70% to pass.";
 const note=ctx.key&&pass&&!xp?"Already completed. No extra XP.":ctx.kind==="mix"?"Mixed quizzes are practice only.":ctx.kind==="review"?"Reviews award +5 XP the first time per lesson.":"";
 view(`<div class="qz card c"><div class="stars">${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</div><h2>${msg}</h2><p>Score: <b>${c} / ${qs.length}</b></p>${xp?`<div class="n gd">+${xp} XP</div>`:""}<p class="mu">${note}</p>${nb}${pass||ctx.kind==="mix"||ctx.kind==="daily"||ctx.kind==="review"?"":`<button class="btn" data-a="retry">TRY AGAIN</button>`}<button class="btn g" data-a="back">Back</button></div>`)
}
function seededShuffle(arr,seedStr){
 let seed=2166136261>>>0;
 for(let i=0;i<seedStr.length;i++){seed^=seedStr.charCodeAt(i);seed=Math.imul(seed,16777619)>>>0}
 const rand=()=>{seed^=seed<<13;seed>>>=0;seed^=seed>>17;seed^=seed<<5;seed>>>=0;return seed/4294967296};
 const a=arr.slice();
 for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 return a
}

 if(g.error)throw g.error;
 const prog={};
 (g.data||[]).forEach(x=>{if(x.lesson_key)prog[x.lesson_key]=1;});
 USER={id:au.id,username:p.username,display_name:p.display_name||p.username,role:p.role||"student",year:p.year||"",classCode:p.class_code||"",recoveryEmail:p.recovery_email||"",xp:+p.xp||0,streak:+p.streak||0,lastActive:p.last_active||null,leaderboardOptOut:!!p.leaderboard_opt_out,streakFreezes:+p.streak_freezes||0,hearts:p.hearts??5,dailyXp:p.daily_xp||0,dailyXpDate:p.daily_xp_date||null,progress:prog,dailyDone:null};
 if(USER.lastActive)st.set("uasaLastActive_"+au.id,USER.lastActive);
 try{
  const d=await sb.from("daily_completions").select("day").eq("user_id",au.id).eq("day",today()).maybeSingle();
  if(d.data)USER.dailyDone=today();
 }catch(e){}
 await refreshHearts();
 await refreshUserStats();
}
function enter(){$("auth").classList.add("hidden");$("app").classList.remove("hidden");hdr();go("home")}
async function logout(){try{await sb.auth.signOut()}catch(e){}USER=null;R=null;$("app").classList.add("hidden");$("auth").classList.remove("hidden");authTab("l")}
async function signup(){
 if(!sb){authMsg("Could not load Supabase.");return}
 const n=$("su").value.trim(),pw=$("sp").value,yr=$("sy").value;
 if(!/^[A-Za-z0-9_.-]{3,20}$/.test(n)){authMsg("Username must be 3 to 20 letters, numbers, dots, dashes or underscores.");return}
 if(pw.length<8){authMsg("Password must be at least 8 characters.");return}
 authMsg("Creating account…");
 const cc=$("sc")?$("sc").value.trim().toUpperCase():"";
 const re=$("sr")?$("sr").value.trim().toLowerCase():"";
 if(re && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(re)){authMsg("That recovery email doesn't look right.");return}
 const{data,error}=await sb.auth.signUp({email:cloudEmail(n),password:pw,options:{data:{year:yr}}});
 if(error){authMsg(/registered|exists/i.test(error.message)?"That username is taken.":"Sign up failed: "+error.message);return}
 let au=data.user;
 if(!data.session){
  const s=await sb.auth.signInWithPassword({email:cloudEmail(n),password:pw});
  if(s.error){authMsg("Turn off Confirm email in Supabase.");return}
  au=s.data.user
 }
 const ins=await sb.from("profiles").upsert({id:au.id,username:n,display_name:n,year:yr,class_code:cc||null,recovery_email:re||null,xp:0,streak:0,last_active:null},{onConflict:"id"});
 if(ins.error){authMsg("Profile failed: "+ins.error.message);return}
 await loadUser(au);enter();toast("🎉 Welcome, "+n+"!")
}
async function login(){
 if(!sb){authMsg("Could not load Supabase.");return}
 const n=$("lu").value.trim(),pw=$("lp").value;
 if(!n||!pw){authMsg("Enter username and password.");return}
 authMsg("Logging in…");
 const{data,error}=await sb.auth.signInWithPassword({email:cloudEmail(n),password:pw});
 if(error){authMsg("Wrong username or password.");return}
 await loadUser(data.user);enter()
}
async function requestReset(){
 const n=$("fu").value.trim().toLowerCase();
 if(!n){authMsg("Enter your username.");return}
 authMsg("Sending…");
 try{
  const res=await sb.functions.invoke("request-password-reset",{body:{username:n}});
  if(res.error)throw res.error;
  if(res.data&&res.data.error){authMsg(res.data.error);return}
  $("cu").value=n;
  authMsg("");
  authTab("c");
  toast("📧 Check your email for the code");
 }catch(e){
  authMsg("Could not send code: "+(e.message||e));
 }
}
async function confirmReset(){
 const n=$("cu").value.trim().toLowerCase();
 const code=$("cc").value.trim();
 const np=$("cn").value;
 if(!n||!code){authMsg("Enter your username and code.");return}
 if(np.length<8){authMsg("New password must be at least 8 characters.");return}
 authMsg("Resetting…");
 try{
  const res=await sb.functions.invoke("confirm-password-reset",{body:{username:n,code,new_password:np}});
  if(res.error)throw res.error;
  if(res.data&&res.data.error){authMsg(res.data.error);return}
  authMsg("");
  toast("✅ Password changed! Log in now.");
  $("lu").value=n;
  $("lp").value="";
  authTab("l");
 }catch(e){
  authMsg("Could not reset: "+(e.message||e));
 }
}
[["lf",login],["sf",signup],["ff",requestReset],["cf",confirmReset]].forEach(([id,fn])=>$(id).addEventListener("submit",async e=>{
 e.preventDefault();
 const b=e.target.querySelector("button");b.disabled=true;
 try{await fn()}catch(err){authMsg("Error: "+(err.message||err))}
 b.disabled=false
}));
$("pw").addEventListener("change",e=>{$("lp").type=$("sp").type=e.target.checked?"text":"password"});
applyTheme();
$("theme")?.addEventListener("click",toggleTheme);
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-a]");if(!t)return;
 const r=t.dataset.r,F={
  auth:()=>authTab(r),page:()=>go(r),logout:logout,mix:()=>startMix(r),subj:()=>subj(r),
  showForgot:()=>authTab("f"),showLogin:()=>authTab("l"),
  unit:()=>unit(+r),les:()=>lesson(+r),startLes:startLes,startCh:startCh,ans:()=>answer(+r),
  next:next,retry:()=>R&&quiz(R.raw,R.ctx),back:()=>R&&R.ctx.back(),
  chest:()=>claimChest(+r),submitW:submitW,
  daily:startDaily,student:()=>openStudent(r),
  saveProfile:saveProfile,resetStudent:()=>resetStudent(r),
  createClass:createClass,report:generateReport,
  rv:()=>startReview(r,t.dataset.s,t.dataset.u,t.dataset.l)
 };
 if(F[t.dataset.a])F[t.dataset.a]()
});
document.addEventListener("keydown",e=>{
 if(R&&$("an")&&/^[1-9]$/.test(e.key)&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))answer(+e.key-1)
});
let deferredInstall=null;
window.addEventListener("beforeinstallprompt",e=>{
 e.preventDefault();
 deferredInstall=e;
 const b=$("installBox");
 if(b)b.classList.remove("hidden");
});
document.addEventListener("click",e=>{
 if(e.target.id!=="installBtn"||!deferredInstall)return;
 deferredInstall.prompt();
 deferredInstall.userChoice.then(c=>{
  if(c.outcome==="accepted"){const b=$("installBox");if(b)b.classList.add("hidden");}
  deferredInstall=null;
 });
});
window.addEventListener("appinstalled",()=>{
 const b=$("installBox");if(b)b.classList.add("hidden");
 toast("🎉 UASA+ installed!");
});
(async()=>{
 if(!sb){authMsg("Could not load Supabase library.");return}
 try{
  const{data}=await sb.auth.getSession();
  if(data.session){await loadUser(data.session.user);enter()}
 }catch(e){console.warn(e)}
})();
if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("sw.js").catch(e=>console.warn("SW failed",e));
 });
}
</script>
