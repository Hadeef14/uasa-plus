questions:[Q("Melaka diasaskan oleh…",["Hang Tuah","Parameswara","Tun Perak"],1),Q("Laksamana terkenal Melaka ialah…",["Hang Tuah","Tun Perak","Parameswara"],0),Q("Undang-undang Melaka ialah…",["Rukun Negara","Hukum Kanun Melaka","Perlembagaan"],1),Q("Melaka terkenal sebagai pusat…",["perdagangan","perlombongan","pertanian sahaja"],0)]}],

const mem={},st={get:k=>{try{const v=localStorage.getItem(k);if(v!==null)return v}catch(e){}return k in mem?mem[k]:null},set:(k,v)=>{mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}},del:k=>{delete mem[k];try{localStorage.removeItem(k)}catch(e){}}};
const jp=(t,d)=>{try{const v=JSON.parse(t);return v==null?d:v}catch(e){return d}};

async function hp(pw,salt){
 const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+pw));
 return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")
}

const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const sq=q=>{const o=shuf(q.options.map((t,i)=>[t,i]));return{q:q.q,options:o.map(x=>x[0]),answer:o.findIndex(x=>x[1]===q.answer)}};

 t.className="toast";
 t.setAttribute("role","status");
 t.textContent=m;
 document.body.appendChild(t);
 setTimeout(()=>t.remove(),2400)
}

}

/* ---------- CLOUD XP + PROGRESS ---------- */
async function award(n,key){
 const b=lvl();

 USER.xp+=n;
 USER.progress[key]=1;

 if(USER.lastActive!==today()){
  USER.streak=USER.lastActive===yest()?USER.streak+1:1;
  USER.lastActive=today();
  st.set("uasaLastActive_"+USER.id,today())
 }

 saveU();
 hdr();

 try{
  const p=await supabase
   .from("profiles")
   .update({
    xp:USER.xp,
    streak:USER.streak
   })
   .eq("id",USER.id);

  if(p.error)throw p.error;

  const q=await supabase
   .from("progress")
   .upsert(
    {
     user_id:USER.id,
     lesson_key:key
    },
    {
     onConflict:"user_id,lesson_key"
    }
   );

  if(q.error)throw q.error;

 }catch(e){
  console.warn("Cloud save failed",e)
 }

 if(lvl()>b)toast("🎉 Level "+lvl()+" reached!");
 if(n)pop(n)
}

/* curriculum accessors: units/lessons with original indexes, empty slots skipped */
const U=s=>Array.from((CURRICULUM[s]||{}).units||[],(x,i)=>x?{...x,i,ls:Array.from(x.lessons||[],(y,j)=>y&&y.questions&&y.questions.length?{...y,j}:null).filter(Boolean)}:null).filter(Boolean);
const key=(s,u,l)=>s+"|"+u+"|"+l,done=k=>!!USER.progress[k],ut=u=>u.title||"Unit "+(u.i+1);
const nDone=(s,u)=>u.ls.filter(l=>done(key(s,u.i,l.j))).length;
const sTot=s=>U(s).reduce((a,u)=>a+u.ls.length,0),sDone=s=>U(s).reduce((a,u)=>a+nDone(s,u),0);
const unlocked=(s,u,x)=>x===0||done(key(s,u.i,u.ls[x-1].j)),chOpen=(s,u)=>u.ls.length>0&&nDone(s,u)===u.ls.length;
const cur=()=>{const u=U(NAV.s).find(x=>x.i===NAV.u);return{u,idx:u?u.ls.findIndex(l=>l.j===NAV.l):-1}};
const pool=s=>{const o=[];(s?[s]:SUBJ.map(x=>x[0])).forEach(n=>U(n).forEach(u=>{u.ls.forEach(l=>o.push(...l.questions));o.push(...(u.challenge||[]))}));return o};

/* ---------- GLOBAL LEADERBOARD ---------- */
async function loadLeaderboard(){
 const box=$("lb");
 if(!box)return;

 const {data,error}=await supabase
  .from("profiles")
  .select("username,xp")
  .order("xp",{ascending:false})
  .limit(100);

 if(error){
  box.innerHTML="<p>Could not load leaderboard. Check your connection.</p>";
  console.error(error);
  return
 }

 const m=["🥇","🥈","🥉"];

 box.innerHTML=(data||[]).map((u,i)=>
  `<div class="lbr ${u.username===USER.username?"me":""}">
   <span>${m[i]||"#"+(i+1)} ${esc(u.username)}</span>
   <b>${+u.xp||0} XP</b>
  </div>`
 ).join("")||"<p>No players yet.</p>"
}

 R=null;
