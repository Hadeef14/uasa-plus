 if(!unlocked(s,u,x)){toast("🔒 Finish the previous lesson first.");return}
 NAV.l=j;const l=u.ls[x];
 view(`<div class="mu">${lk("page","subjects","Subjects")} › ${lk("subj",s,esc(s))} › ${lk("unit",u.i,esc(ut(u)))}</div><h1>${esc(l.title||"Lesson "+(j+1))} ${done(key(s,u.i,j))?"✓":""}</h1><div class="card learn">${l.learn||"<p>Practice this lesson's questions.</p>"}</div><button class="btn" data-a="startLes">START ${l.questions.length} QUESTIONS</button><button class="btn g" data-a="unit" data-r="${u.i}">← Back</button>`)
}
function startLes(){
 const s=NAV.s,u=U(s).find(x=>x.i===NAV.u),x=u?u.ls.findIndex(l=>l.j===NAV.l):-1;
 if(x<0||!unlocked(s,u,x))return;
 const l=u.ls[x];
 quiz(l.questions,{title:l.title||"Lesson",key:key(s,u.i,l.j),bonus:20,kind:"lesson",back:()=>unit(u.i)})
}
function startCh(){
 const s=NAV.s,u=U(s).find(x=>x.i===NAV.u);
 if(!u||!chOpen(s,u)||!(u.challenge||[]).length){toast("🔒 Finish all lessons first.");return}
 quiz(u.challenge,{title:"Unit Challenge",key:key(s,u.i,"c"),bonus:50,kind:"challenge",back:()=>unit(u.i)})
}
function startMix(s){
 const p=pool(s||"");
 if(!p.length){toast("No questions yet.");return}
 quiz(shuf(p).slice(0,10),{title:s?"Mixed: "+s:"Mixed quiz",key:null,bonus:0,kind:"mix",back:()=>s?subj(s):go("home")})
}
function quiz(qs,ctx){R={raw:qs,qs:qs.map(sq),i:0,c:0,a:false,ctx};draw()}
function draw(){
 const q=R.qs[R.i];
 if(q.w){
  view(`<div class="qz"><div class="row"><button class="btn g" data-a="back" aria-label="Quit">✕</button>${bar(R.i/R.qs.length*100)}</div>
  <small>${esc(R.ctx.title)} · Writing ${R.i+1} of ${R.qs.length}</small>
  <h2>${esc(q.w)}</h2>
  <p class="mu">Write between <b>${q.min}</b> and <b>${q.max}</b> words.</p>
  <textarea id="wt" rows="8" placeholder="Write your answer here..."></textarea>
  <p id="wc" class="mu">0 words</p>
  <button class="btn" data-a="submitW">SUBMIT</button>
  <div id="wfb" role="status"></div>
  <button id="nx" class="btn hidden" data-a="next">${R.i+1<R.qs.length?"CONTINUE":"FINISH"}</button></div>`);
  const ta=$("wt"),wcEl=$("wc");
  ta.addEventListener("input",()=>{
   const n=(ta.value.trim().match(/\S+/g)||[]).length;
   wcEl.textContent=n+" words";
   wcEl.style.color=(n>=q.min&&n<=q.max)?"var(--gd)":"var(--mu)"
  });
  ta.focus();
  return
 }
 view(`<div class="qz"><div class="row"><button class="btn g" data-a="back" aria-label="Quit quiz">✕</button>${bar(R.i/R.qs.length*100)}</div><small>${esc(R.ctx.title)} · Question ${R.i+1} of ${R.qs.length}</small><h2>${esc(q.q)}</h2><div id="an">${q.options.map((o,k)=>`<button class="ans" data-a="ans" data-r="${k}"><b>${k+1}</b><span>${esc(o)}</span></button>`).join("")}</div><div id="fb" role="status"></div><button id="nx" class="btn hidden" data-a="next">${R.i+1<R.qs.length?"CONTINUE":"FINISH"}</button></div>`)
}
function answer(k){
 if(!R||R.a||!$("an"))return;
 const q=R.qs[R.i];if(k<0||k>=q.options.length)return;
 R.a=true;const ok=k===q.answer;if(ok)R.c++;
 document.querySelectorAll("#an .ans").forEach((b,x)=>{b.disabled=true;if(x===q.answer)b.classList.add("ok");else if(x===k)b.classList.add("no")});
 $("fb").innerHTML=`<div class="fb">${ok?"✅ Correct!":"❌ Not quite. Correct answer: "+esc(q.options[q.answer])}</div>`;
 $("nx").classList.remove("hidden");$("nx").focus()
}
async function submitW(){
 if(!R||R.a)return;
 const q=R.qs[R.i],ta=$("wt");
 if(!ta)return;
 const n=(ta.value.trim().match(/\S+/g)||[]).length;
 if(n<q.min||n>q.max){
  $("wfb").innerHTML=`<div class="fb no">Write between ${q.min} and ${q.max} words. You wrote ${n}.</div>`;
  return
 }
 const btn=document.querySelector('[data-a="submitW"]');
 btn.disabled=true;btn.textContent="CHECKING...";
 $("wfb").innerHTML=`<div class="fb">📝 Marking your essay…</div>`;
 try{
  const res=await sb.functions.invoke("grade-essay",{body:{essay:ta.value.trim(),prompt:q.w,min:q.min,max:q.max}});
  if(res.error)throw res.error;
  const d=res.data||{};
  const score=+d.score||0;
  const pass=score>=5;
  let html=`<div class="fb ${pass?"ok":"no"}">Score: <b>${score}/10</b><br>${esc(d.feedback||"")}</div>`;
  if(Array.isArray(d.improvements)&&d.improvements.length){
   html+=`<div class="fb">💡 ${d.improvements.map(esc).join("<br>💡 ")}</div>`
  }
  $("wfb").innerHTML=html;
  if(pass){
   R.a=true;R.c++;
   btn.classList.add("hidden");
   $("nx").classList.remove("hidden");
   $("nx").focus()
  }else{
   btn.disabled=false;btn.textContent="TRY AGAIN"
  }
 }catch(e){
  $("wfb").innerHTML=`<div class="fb no">⚠️ Could not mark: ${esc(e.message||String(e))}</div>`;
  btn.disabled=false;btn.textContent="SUBMIT"
 }
}
function next(){if(!R||!R.a)return;R.i++;R.a=false;R.i<R.qs.length?draw():finish()}
function finish(){
 const{c,qs,ctx}=R,ratio=c/qs.length,pass=ratio>=.7;let xp=0;
 if(ctx.key&&pass&&!done(ctx.key)){xp=c*10+ctx.bonus;award(xp,ctx.key)}
 const stars=ratio===1?3:ratio>=.9?2:pass?1:0;
 let nb="";
 if(pass&&ctx.kind==="lesson"){
  const s=NAV.s,u=U(s).find(x=>x.i===NAV.u),x=u.ls.findIndex(l=>l.j===NAV.l),n=u.ls[x+1];
  nb=n?`<button class="btn" data-a="les" data-r="${n.j}">NEXT LESSON</button>`:(chOpen(s,u)&&(u.challenge||[]).length?`<button class="btn" data-a="startCh">UNIT CHALLENGE</button>`:"")
 }
 const msg=ctx.kind==="mix"?"Nice practice!":pass?"You passed! 🎉":"Almost there. You need 70% to pass.";
 const note=ctx.key&&pass&&!xp?"Already completed. No extra XP.":ctx.kind==="mix"?"Mixed quizzes are practice only.":"";
 view(`<div class="qz card c"><div class="stars">${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</div><h2>${msg}</h2><p>Score: <b>${c} / ${qs.length}</b></p>${xp?`<div class="n gd">+${xp} XP</div>`:""}<p class="mu">${note}</p>${nb}${pass||ctx.kind==="mix"?"":`<button class="btn" data-a="retry">TRY AGAIN</button>`}<button class="btn g" data-a="back">Back</button></div>`)
}
const okQ=q=>q&&(q.w&&typeof q.w==="string"||typeof q.q==="string"&&q.q.trim()&&Array.isArray(q.options)&&q.options.length>1&&q.options.every(o=>typeof o==="string"&&o.trim())&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<q.options.length);
function applyImp(){
 const a=jp(st.get("uasaImported"),[]);
 (Array.isArray(a)?a:[]).forEach(it=>{
  if(!it||!SUBJ.some(x=>x[0]===it.s)||!Array.isArray(it.qs))return;
  const c=CURRICULUM[it.s]=CURRICULUM[it.s]||{units:[]};
  const un=c.units[it.u-1]=c.units[it.u-1]||{title:"",lessons:[]};
  un.lessons=un.lessons||[];
  if(it.ut)un.title=it.ut;
  if(it.l==="c")un.challenge=it.qs;
  else un.lessons[it.l-1]={title:it.lt||"Lesson "+it.l,learn:it.lr?P(...it.lr.split(/\n\s*\n/).map(esc)):"",questions:it.qs}
 })
}
function doImport(){
 const m=$("im"),s=$("is").value,u=parseInt($("iu").value,10),lv=$("il").value.trim().toLowerCase(),qs=jp($("ij").value,null);
 if(!(u>=1&&u<=30)){m.textContent="Unit number must be 1 to 30.";return}
 const isC=lv==="c",l=parseInt(lv,10);
 if(!isC&&!(l>=1&&l<=30)){m.textContent="Lesson must be a number (1 to 30) or c.";return}
 if(!Array.isArray(qs)||!qs.length||!qs.every(okQ)){m.textContent="Paste a JSON list.";return}
 const it={s,u,l:isC?"c":l,ut:$("iut").value.trim(),lt:$("it").value.trim(),lr:$("ilr").value.trim(),qs};
 const all=jp(st.get("uasaImported"),[]).filter(x=>!(x.s===it.s&&x.u===it.u&&x.l===it.l));
 all.push(it);st.set("uasaImported",JSON.stringify(all));applyImp();
 m.textContent="Imported "+qs.length+" questions."
}
const authMsg=t=>{$("am").textContent=t};
function authTab(r){const l=r==="l";$("lf").classList.toggle("hidden",!l);$("sf").classList.toggle("hidden",l);$("tl").className="btn"+(l?"":" g");$("ts").className="btn"+(l?" g":"");authMsg("")}
async function loadUser(au){
 let r=await sb.from("profiles").select("username,xp,streak,year").eq("id",au.id).maybeSingle();
 if(r.error)throw r.error;
 let p=r.data;
 if(!p){
  const name=(au.email||"user").split("@")[0];
  const yr=(au.user_metadata&&au.user_metadata.year)||"Year 6";
  const ins=await sb.from("profiles").upsert({id:au.id,username:name,year:yr,xp:0,streak:0},{onConflict:"id"});
  if(ins.error)throw ins.error;
  p={username:name,year:yr,xp:0,streak:0}
 }
 const g=await sb.from("progress").select("lesson_key").eq("user_id",au.id);
 const prog={};(g.data||[]).forEach(x=>prog[x.lesson_key]=1);
 const loc=accts()[p.username];if(loc&&loc.progress)Object.assign(prog,loc.progress);
 USER={id:au.id,username:p.username,year:p.year||"",xp:+p.xp||0,streak:+p.streak||0,lastActive:st.get("uasaLastActive_"+au.id),progress:prog}
}
function enter(){$("auth").classList.add("hidden");$("app").classList.remove("hidden");hdr();go("home")}
async function logout(){try{await sb.auth.signOut()}catch(e){}USER=null;R=null;$("app").classList.add("hidden");$("auth").classList.remove("hidden");authTab("l")}
async function signup(){
 if(!sb){authMsg("Could not load Supabase.");return}
 const n=$("su").value.trim(),pw=$("sp").value,yr=$("sy").value;
 if(!/^[A-Za-z0-9_.-]{3,20}$/.test(n)){authMsg("Username must be 3 to 20 letters, numbers, dots, dashes or underscores.");return}
 if(pw.length<6){authMsg("Password must be at least 6 characters.");return}
 authMsg("Creating account…");
 const{data,error}=await sb.auth.signUp({email:cloudEmail(n),password:pw,options:{data:{year:yr}}});
 if(error){authMsg(/registered|exists/i.test(error.message)?"That username is taken.":"Sign up failed: "+error.message);return}
 let au=data.user;
 if(!data.session){
  const s=await sb.auth.signInWithPassword({email:cloudEmail(n),password:pw});
  if(s.error){authMsg("Turn off Confirm email in Supabase.");return}
  au=s.data.user
 }
 const ins=await sb.from("profiles").upsert({id:au.id,username:n,year:yr,xp:0,streak:0},{onConflict:"id"});
 if(ins.error){authMsg("Profile failed: "+ins.error.message);return}
 await loadUser(au);enter();toast("🎉 Welcome, "+n+"!")
}
async function login(){
 if(!sb){authMsg("Could not load Supabase.");return}
 const n=$("lu").value.trim(),pw=$("lp").value;
 if(!n||!pw){authMsg("Enter username and password.");return}
 authMsg("Logging in…");
 const{data,error}=await sb.auth.signInWithPassword({email:cloudEmail(n),password:pw});
 if(error){authMsg("Wrong username or password.");return}
 await loadUser(data.user);enter()
}
[["lf",login],["sf",signup]].forEach(([id,fn])=>$(id).addEventListener("submit",async e=>{
 e.preventDefault();
 const b=e.target.querySelector("button");b.disabled=true;
 try{await fn()}catch(err){authMsg("Error: "+(err.message||err))}
 b.disabled=false
}));
$("pw").addEventListener("change",e=>{$("lp").type=$("sp").type=e.target.checked?"text":"password"});
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-a]");if(!t)return;
 const r=t.dataset.r,F={
  auth:()=>authTab(r),page:()=>go(r),logout:logout,mix:()=>startMix(r),subj:()=>subj(r),
  unit:()=>unit(+r),les:()=>lesson(+r),startLes:startLes,startCh:startCh,ans:()=>answer(+r),
  next:next,imp:doImport,retry:()=>R&&quiz(R.raw,R.ctx),back:()=>R&&R.ctx.back(),
  chest:()=>claimChest(+r),submitW:submitW
 };
 if(F[t.dataset.a])F[t.dataset.a]()
});
document.addEventListener("keydown",e=>{
 if(R&&$("an")&&/^[1-9]$/.test(e.key)&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))answer(+e.key-1)
});
(async()=>{
 applyImp();
 if(!sb){authMsg("Could not load Supabase library.");return}
 try{
  const{data}=await sb.auth.getSession();
  if(data.session){await loadUser(data.session.user);enter()}
 }catch(e){console.warn(e)}
})();
</script>
